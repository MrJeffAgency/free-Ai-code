<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0b0e14" />
<title>MJA Assistant</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#121722; --panel2:#171d2b; --line:#232c3d;
    --text:#e6edf7; --muted:#8b98ad; --accent:#f97316; --accent2:#fb923c;
    --user:#1d2b45; --bot:#121722; --ok:#22c55e; --err:#ef4444;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
  button,input,textarea,select{font-family:inherit}
  button{cursor:pointer}
  .app{display:flex;flex-direction:column;height:100vh;max-width:820px;margin:0 auto}

  header{display:flex;align-items:center;gap:10px;padding:12px 14px;
    background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  header img{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}
  .brand{font-weight:700;font-size:17px;flex:1}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:4px}
  .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:7px 10px;font-size:13px}

  .tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .tab{flex:1;padding:11px 4px;text-align:center;background:none;border:0;color:var(--muted);
    font-weight:600;font-size:13px;border-bottom:2px solid transparent}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}

  main{flex:1;overflow:hidden;position:relative}
  .view{display:none;height:100%;flex-direction:column}
  .view.active{display:flex}

  /* ---------- Chat ---------- */
  .bar{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
  select,input[type=text]{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:8px 10px;font-size:13px;outline:none}
  select{max-width:100%;flex:1;min-width:120px}
  .btn{background:var(--accent);color:#0b0e14;border:0;border-radius:9px;padding:8px 12px;font-weight:700;font-size:13px}
  .btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.5}

  #chatLog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:92%;padding:11px 13px;border-radius:var(--radius);line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.user{align-self:flex-end;background:var(--user);border-bottom-right-radius:4px}
  .msg.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg .who{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .msg pre{background:#080b11;border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;font-size:13px;white-space:pre}
  .msg code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .copy{float:right;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:6px;font-size:11px;padding:3px 7px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 12px 10px}
  .chip{background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    border-radius:999px;padding:7px 12px;font-size:12px}
  .empty{text-align:center;color:var(--muted);margin:auto;padding:24px;line-height:1.6}
  .empty h2{color:var(--text);margin:0 0 8px;font-size:20px}

  .composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex:0 0 auto;align-items:flex-end}
  .composer textarea{flex:1;min-height:46px;max-height:130px;resize:none;background:var(--panel2);
    color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px;font-size:14px;outline:none}
  .composer textarea:focus{border-color:var(--accent)}

  /* ---------- Code ---------- */
  .pane{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
  label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  textarea.area{width:100%;min-height:170px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:11px;padding:12px;font-family:ui-monospace,monospace;font-size:13px;outline:none;resize:vertical}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:12px;
    white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:14px;min-height:60px}
  .result pre{background:#080b11;border:1px solid var(--line);border-radius:8px;padding:10px;overflow-x:auto}

  /* ---------- Notes ---------- */
  .notes{display:flex;flex-direction:column;gap:8px}
  .note{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;cursor:pointer}
  .note:hover{border-color:var(--accent)}
  .note b{display:block;font-size:14px;margin-bottom:4px}
  .note span{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .notetools{display:flex;gap:8px;margin-bottom:10px}
  .notetools input{flex:1}
  #noteEditor{display:none;flex-direction:column;gap:10px;flex:1}
  #noteEditor.active{display:flex}
  #noteTitle{width:100%;font-size:17px;font-weight:700}
  #noteBody{flex:1;min-height:200px;width:100%;background:var(--panel);color:var(--text);
    border:1px solid var(--line);border-radius:11px;padding:12px;resize:none;font-size:14px;outline:none}
  #noteList.flex-off{display:none}

  /* ---------- Settings modal ---------- */
  .overlay{display:none;position:fixed;inset:0;background:#000a;z-index:50;align-items:center;justify-content:center;padding:18px}
  .overlay.active{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:440px}
  .modal h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:12px}
  .field label{display:block;margin-bottom:5px}
  .field input{width:100%}
  .modal .btn{width:100%;margin-top:6px}
  .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);
    color:#0b0e14;padding:10px 16px;border-radius:999px;font-weight:700;font-size:13px;
    opacity:0;transition:opacity .25s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="icon.png" alt="MJA" />
    <div class="brand">MJA Assistant</div>
    <span class="dot" id="dot"></span>
    <button class="iconbtn" id="settingsBtn">⚙</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="chat">💬 Chat</button>
    <button class="tab" data-tab="code">&lt;/&gt; Code</button>
    <button class="tab" data-tab="notes">📝 Notes</button>
  </div>

  <main>
    <!-- CHAT -->
    <section class="view active" id="view-chat">
      <div class="bar">
        <select id="modelSel"><option>(server default)</option></select>
        <button class="btn ghost" id="newChat">New</button>
        <button class="btn ghost" id="refreshModels">↻</button>
        <button class="btn" id="stopBtn" style="display:none">Stop</button>
      </div>
      <div id="chatLog">
        <div class="empty" id="chatEmpty">
          <h2>Hi, I'm your MJA Assistant 👋</h2>
          I can chat, help with code, and talk about your notes — all through your local MJA server.
        </div>
      </div>
      <div class="chips" id="chips">
        <button class="chip">Plan my day</button>
        <button class="chip">Explain this code</button>
        <button class="chip">Write a message</button>
        <button class="chip">Brainstorm ideas</button>
      </div>
      <div class="composer">
        <textarea id="chatInput" placeholder="Ask me anything…"></textarea>
        <button class="btn" id="sendBtn">Send</button>
      </div>
    </section>

    <!-- CODE -->
    <section class="view" id="view-code">
      <div class="pane">
        <label>Paste your code or error</label>
        <textarea class="area" id="codeInput" placeholder="Paste code, an error message, or describe what you need…"></textarea>
        <div class="actions">
          <button class="btn" data-act="Explain this code. Be concise.">Explain</button>
          <button class="btn ghost" data-act="Find and fix the bugs. Return corrected code with a short explanation.">Fix bugs</button>
          <button class="btn ghost" data-act="Optimize this code for readability and performance. Return the improved code.">Optimize</button>
          <button class="btn ghost" data-act="Write unit tests for this code.">Write tests</button>
          <button class="btn ghost" data-act="Add clear comments and documentation to this code.">Document</button>
        </div>
        <label>Result</label>
        <div class="result" id="codeResult">Pick an action above to get started.</div>
      </div>
    </section>

    <!-- NOTES -->
    <section class="view" id="view-notes">
      <div class="pane" id="noteListPane">
        <div class="notetools">
          <input type="text" id="noteSearch" placeholder="Search notes…" />
          <button class="btn" id="newNote">+ New</button>
        </div>
        <div class="notes" id="noteList"></div>
      </div>
      <div id="noteEditor">
        <input type="text" id="noteTitle" placeholder="Note title" />
        <textarea id="noteBody" placeholder="Write your note…"></textarea>
        <div class="actions">
          <button class="btn" id="noteSave">Save</button>
          <button class="btn ghost" id="noteAsk">Ask AI about this</button>
          <button class="btn ghost" id="noteDelete">Delete</button>
          <button class="btn ghost" id="noteBack">Back</button>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- Settings -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>⚙ Settings</h3>
    <div class="field"><label>Server URL</label><input type="text" id="setUrl" /></div>
    <div class="field"><label>Model (blank = server default)</label><input type="text" id="setModel" /></div>
    <div class="field"><label>Bearer token (if Proxy Auth is on)</label><input type="text" id="setToken" /></div>
    <button class="btn" id="setSave">Save</button>
    <div class="hint">MJA must be running on your device. Default: http://127.0.0.1:8083</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const K={url:"mja.url",model:"mja.model",token:"mja.token",notes:"mja.notes",chat:"mja.chat"};
  const $=id=>document.getElementById(id);
  const url=()=>localStorage.getItem(K.url)||"http://127.0.0.1:8083";
  const model=()=>localStorage.getItem(K.model)||"";
  const token=()=>localStorage.getItem(K.token)||"";
  const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800)};
  function headers(){const h={"Content-Type":"application/json"};if(token())h.Authorization="Bearer "+token();return h}

  let history=[];try{history=JSON.parse(localStorage.getItem(K.chat)||"[]")}catch(e){history=[]}
  let models=[];let busy=false;let controller=null;let notes=[];try{notes=JSON.parse(localStorage.getItem(K.notes)||"[]")}catch(e){notes=[]}
  let editingNote=null;

  /* ---------- connection + models ---------- */
  async function check(){
    try{const r=await fetch(url().replace(/\/$/,"")+"/health",{headers:headers()});
      $("dot").classList.toggle("on",r.ok)}catch(e){$("dot").classList.remove("on")}
  }
  async function loadModels(){
    const sel=$("modelSel");
    try{
      const r=await fetch(url().replace(/\/$/,"")+"/v1/models",{headers:headers()});
      const d=await r.json();models=(d.data||[]).map(m=>m.id).filter(Boolean);
      sel.innerHTML="";sel.appendChild(new Option("(server default)",""));
      models.forEach(m=>sel.appendChild(new Option(m,m)));sel.value=model();
    }catch(e){sel.innerHTML='<option>(server unreachable)</option>';toast("Could not load models")}
  }

  /* ---------- markdown-lite renderer ---------- */
  function render(text){
    let out="",i=0;
    while(i<text.length){
      const f=text.indexOf("```",i);
      if(f<0){out+=esc(text.slice(i));break}
      out+=esc(text.slice(i,f));
      const nl=text.indexOf("\n",f);if(nl<0){out+=esc(text.slice(f));break}
      const end=text.indexOf("```",nl+1);
      if(end<0){out+=esc(text.slice(f));break}
      let lang=text.slice(f+3,nl).trim();
      let code=text.slice(nl+1,end);
      out+='<pre><button class="copy" data-code="'+encodeURIComponent(code)+'">copy</button>'+
           (lang?'<span style="color:var(--accent2)">'+esc(lang)+'</span>\n':'')+esc(code)+'</pre>';
      i=end+3;
    }
    return out;
  }
  document.addEventListener("click",e=>{
    if(e.target.classList.contains("copy")){
      const t=decodeURIComponent(e.target.dataset.code||"");
      if(navigator.clipboard)navigator.clipboard.writeText(t);
      else{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
      e.target.textContent="copied!";setTimeout(()=>e.target.textContent="copy",1200);
    }
  });

  /* ---------- chat ---------- */
  function drawChat(){
    const log=$("chatLog");log.innerHTML="";
    if(!history.length){
      log.innerHTML='<div class="empty"><h2>Hi, I\'m your MJA Assistant 👋</h2>I can chat, help with code, and talk about your notes — all through your local MJA server.</div>';
      $("chips").style.display="flex";return;
    }
    $("chips").style.display="none";
    history.forEach(m=>{
      const d=document.createElement("div");d.className="msg "+m.role;
      d.innerHTML='<div class="who">'+(m.role==="user"?"You":"MJA")+'</div>'+render(m.content);
      log.appendChild(d);
    });
    log.scrollTop=log.scrollHeight;
  }
  function saveChat(){localStorage.setItem(K.chat,JSON.stringify(history.slice(-60)))}

  async function send(prefill){
    if(busy)return;
    const text=(prefill||$("chatInput").value).trim();if(!text)return;
    $("chatInput").value="";history.push({role:"user",content:text});
    history.push({role:"assistant",content:""});busy=true;drawChat();
    $("sendBtn").disabled=true;$("stopBtn").style.display="";
    controller=new AbortController();
    try{
      const body={model:model()||undefined,messages:history.filter(m=>m.content),stream:true};
      const r=await fetch(url().replace(/\/$/,"")+"/v1/chat/completions",{
        method:"POST",headers:headers(),body:JSON.stringify(body),signal:controller.signal});
      if(!r.ok){const t=await r.text();throw new Error("HTTP "+r.status+": "+t.slice(0,200))}
      const reader=r.body.getReader(),dec=new TextDecoder();let buf="";
      while(true){
        const {done,value}=await reader.read();if(done)break;
        buf+=dec.decode(value,{stream:true});let i;
        while((i=buf.indexOf("\n"))>=0){
          const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
          if(!line.startsWith("data:"))continue;
          const data=line.slice(5).trim();if(data==="[DONE]")continue;
          try{const o=JSON.parse(data);const delta=o.choices&&o.choices[0]&&o.choices[0].delta;
            if(delta&&delta.content){history[history.length-1].content+=delta.content;drawChat()}
          }catch(_){}
        }
      }
    }catch(e){
      const m=(e&&e.name==="AbortError")?"":("\n\n⚠ "+((e&&e.message)||e));
      history[history.length-1].content+=m;drawChat();
    }finally{
      busy=false;controller=null;$("sendBtn").disabled=false;$("stopBtn").style.display="none";
      saveChat();check();
    }
  }
  $("sendBtn").onclick=()=>send();
  $("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}});
  $("stopBtn").onclick=()=>{if(controller)controller.abort()};
  $("newChat").onclick=()=>{history=[];saveChat();drawChat()};
  $("refreshModels").onclick=()=>loadModels();
  document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>send(c.textContent));

  /* ---------- code ---------- */
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{
    const src=$("codeInput").value.trim();if(!src){toast("Paste some code first");return}
    const out=$("codeResult");out.textContent="Thinking…";
    try{
      const r=await fetch(url().replace(/\/$/,"")+"/v1/chat/completions",{
        method:"POST",headers:headers(),
        body:JSON.stringify({model:model()||undefined,messages:[
          {role:"system",content:"You are an expert coding assistant. Format code in markdown fences."},
          {role:"user",content:b.dataset.act+"\n\n```\n"+src+"\n```"}]})});
      const d=await r.json();
      const txt=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      out.innerHTML=render(txt||JSON.stringify(d).slice(0,400));check();
    }catch(e){out.textContent="Error: "+((e&&e.message)||e)}
  });

  /* ---------- notes ---------- */
  function saveNotes(){localStorage.setItem(K.notes,JSON.stringify(notes))}
  function drawNotes(q){
    const list=$("noteList");list.innerHTML="";
    const term=(q||"").toLowerCase();
    const items=notes.filter(n=>!term||(n.title+" "+n.body).toLowerCase().includes(term));
    if(!items.length){list.innerHTML='<div class="empty">No notes yet. Tap + New.</div>';return}
    items.forEach(n=>{
      const d=document.createElement("div");d.className="note";
      d.innerHTML="<b>"+esc(n.title||"Untitled")+"</b><span>"+esc(n.body||"")+"</span>";
      d.onclick=()=>openNote(n);list.appendChild(d);
    });
  }
  function openNote(n){
    editingNote=n;$("noteTitle").value=n.title||"";$("noteBody").value=n.body||"";
    $("noteListPane").classList.add("flex-off");$("noteEditor").classList.add("active");
  }
  function closeNote(){
    editingNote=null;$("noteListPane").classList.remove("flex-off");$("noteEditor").classList.remove("active");drawNotes($("noteSearch").value);
  }
  $("newNote").onclick=()=>{const n={id:Date.now(),title:"",body:""};notes.unshift(n);saveNotes();openNote(n)};
  $("noteSearch").oninput=e=>drawNotes(e.target.value);
  $("noteSave").onclick=()=>{
    if(!editingNote)return;
    editingNote.title=$("noteTitle").value.trim();editingNote.body=$("noteBody").value;
    saveNotes();toast("Saved");closeNote();
  };
  $("noteDelete").onclick=()=>{
    if(!editingNote)return;notes=notes.filter(n=>n!==editingNote);saveNotes();closeNote();toast("Deleted");
  };
  $("noteBack").onclick=closeNote;
  $("noteAsk").onclick=()=>{
    if(!editingNote)return;
    const body=$("noteBody").value.trim();if(!body){toast("Write something first");return}
    switchTab("chat");
    send("Here are my notes. Give me a short summary and 2 practical next steps:\n\n"+body);
  };

  /* ---------- tabs / settings ---------- */
  function switchTab(t){
    document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
    document.querySelectorAll(".view").forEach(v=>v.classList.toggle("active",v.id==="view-"+t));
    if(t==="notes")drawNotes($("noteSearch").value);
  }
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
  $("settingsBtn").onclick=()=>{
    $("setUrl").value=url();$("setModel").value=model();$("setToken").value=token();
    $("settingsOverlay").classList.add("active");
  };
  $("setSave").onclick=()=>{
    localStorage.setItem(K.url,$("setUrl").value.trim().replace(/\/$/,"")||"http://127.0.0.1:8083");
    localStorage.setItem(K.model,$("setModel").value.trim());
    localStorage.setItem(K.token,$("setToken").value.trim());
    $("settingsOverlay").classList.remove("active");toast("Settings saved");loadModels();check();
  };
  $("settingsOverlay").onclick=e=>{if(e.target.id==="settingsOverlay")e.target.classList.remove("active")};

  /* ---------- init ---------- */
  drawChat();check();loadModels();setInterval(check,15000);
})();
</script>
</body>
</html>
